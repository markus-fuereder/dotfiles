# herdr configuration
# Validate with: herdr config check
# Apply with:    herdr server reload-config
#
# Scheme: the modifier identifies the scope, the arrow identifies the target.
#   tabs = ctrl + left/right      panes  = ctrl+shift + arrows
#   workspaces = ctrl + up/down   agents = alt + up/down
# A bare combo+arrow navigates; prefix+combo+arrow reorders.
#
# NOTE: herdr silently ignores unknown [keys] action names and unknown
# [theme.custom] tokens. Typos fail quietly, so keep names exact.

# Onboarding already completed; skip the first-run wizard.
onboarding = false

# THEME
[theme]
# Catppuccin is the base because herdr's custom tokens use its naming.
name = "catppuccin"

## Monokai Pro, ported from collection/kitty/theme.conf
[theme.custom]
accent      = "#85dacc"
panel_bg    = "#403838"
surface_dim = "#383030"
surface0    = "#4a4242"
surface1    = "#554c4d"
overlay0    = "#72696a"
overlay1    = "#8b8283"
text        = "#fff1f3"
subtext0    = "#72696a"
red         = "#fd6883"
green       = "#adda78"
yellow      = "#f9cc6c"
peach       = "#f38d70"
mauve       = "#a8a9eb"
teal        = "#85dacc"
# Monokai Pro has no true blue; kitty maps its blue slot to orange too.
blue        = "#f38d70"

# TERMINAL
[terminal]
new_cwd = "follow"

[keys]
# LEADER KEY
# Pressing ctrl+t twice sends a literal ctrl+t (tmux: bind C-t send-prefix).
prefix = "ctrl+t"

# TABS — combo = ctrl, axis = left/right
## Reordering runs through bin/herdr-place: tab.move exists in the socket API
## but is neither a bindable action nor a CLI subcommand.
new_tab      = "prefix+t"
rename_tab   = "prefix+shift+t"
previous_tab = "ctrl+left"
next_tab     = "ctrl+right"

# PANES — combo = ctrl+shift, axis = all arrows
## Right and down are native; left and up are shell commands below because
## herdr's pane split only accepts --direction right|down.
split_vertical   = "prefix+ctrl+shift+right"
split_horizontal = "prefix+ctrl+shift+down"
rename_pane      = "prefix+shift+p"
focus_pane_left  = "ctrl+shift+left"
focus_pane_right = "ctrl+shift+right"
focus_pane_up    = "ctrl+shift+up"
focus_pane_down  = "ctrl+shift+down"

# WORKSPACES — combo = ctrl, axis = up/down
## new_workspace takes prefix+w, which is herdr's workspace_picker default, so
## the picker is unbound. Workspace navigation is sequential only.
new_workspace      = "prefix+w"
rename_workspace   = "prefix+shift+w"
previous_workspace = "ctrl+up"
next_workspace     = "ctrl+down"
workspace_picker   = ""

# AGENTS — combo = alt, axis = up/down
previous_agent = "alt+up"
next_agent     = "alt+down"
focus_agent    = "alt+1..9"

# SIDEBAR
## Direct binding, so herdr takes alt+s before any pane sees it.
toggle_sidebar = "alt+s"

# CONFIG
reload_config = "prefix+ctrl+r"

# COPY MODE
## herdr's copy mode is vi-style already (tmux: setw -g mode-keys vi).
copy_mode = "prefix+["

# CUSTOM COMMANDS
## Tab reorder — socket API only, see bin/herdr-place.
[[keys.command]]
key = "prefix+ctrl+left"
type = "shell"
description = "Move tab left"
command = "/etc/dotfiles/collection/herdr/bin/herdr-place tab move-prev"

[[keys.command]]
key = "prefix+ctrl+right"
type = "shell"
description = "Move tab right"
command = "/etc/dotfiles/collection/herdr/bin/herdr-place tab move-next"

## Workspace reorder.
[[keys.command]]
key = "prefix+ctrl+up"
type = "shell"
description = "Move workspace up"
command = "/etc/dotfiles/collection/herdr/bin/herdr-place workspace move-prev"

[[keys.command]]
key = "prefix+ctrl+down"
type = "shell"
description = "Move workspace down"
command = "/etc/dotfiles/collection/herdr/bin/herdr-place workspace move-next"

## Pane split left — split right, then swap the new pane leftwards.
[[keys.command]]
key = "prefix+ctrl+shift+left"
type = "shell"
description = "Split left"
command = '"$HERDR_BIN_PATH" pane split --pane "$HERDR_ACTIVE_PANE_ID" --direction right --focus && "$HERDR_BIN_PATH" pane swap --current --direction left'

## Pane split up — split down, then swap the new pane upwards.
[[keys.command]]
key = "prefix+ctrl+shift+up"
type = "shell"
description = "Split up"
command = '"$HERDR_BIN_PATH" pane split --pane "$HERDR_ACTIVE_PANE_ID" --direction down --focus && "$HERDR_BIN_PATH" pane swap --current --direction up'

## Rename agent — no native action, so prompt and call the CLI. Falls back to
## renaming the pane when the focused pane has no detected agent.
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
description = "Rename agent"
width = "60%"
height = "20%"
command = 'printf "Agent name: "; read -r name; [ -n "$name" ] && { "$HERDR_BIN_PATH" agent rename "$HERDR_ACTIVE_PANE_ID" "$name" || "$HERDR_BIN_PATH" pane rename "$HERDR_ACTIVE_PANE_ID" "$name"; }'

## Clear screen (tmux: send-keys C-l). herdr has no scrollback-purge API.
[[keys.command]]
key = "prefix+ctrl+k"
type = "shell"
description = "Clear screen"
command = '"$HERDR_BIN_PATH" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'

# MOUSE / CLIPBOARD
[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
accent = "#85dacc"
