# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
# Config for the kitty_grab kitten. Full option list: kitty_grab/grab.conf.example
# Changes take effect on the next grab; no kitty reload needed.

# Inverted, matching theme.conf's native selection pair so both look alike.
selection_foreground #403838
selection_background #fff1f3

# Monokai Pro teal, to stay visible against the selection block.
cursor #85dacc
